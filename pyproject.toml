[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pplx-diag"
version = "1.3.1"
description = "Diagnostics for Perplexity Computer sandboxes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pplx-diag contributors" }]
keywords = ["perplexity", "computer", "sandbox", "diagnostics", "support"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://pplx-diag.vercel.app"
Documentation = "https://pplx-diag.vercel.app/docs/quickstart"
Source = "https://github.com/jamie0x33-bb/pplx-diag"

[project.scripts]
pplx-diag = "pplx_diag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pplx_diag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
